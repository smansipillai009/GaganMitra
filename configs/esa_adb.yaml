    subsystem: "aocs"
    unit: "RPM"
    nominal_min: -5000.0
    nominal_max: 5000.0
    criticality: "high"
    description: "Synthetic ESA-ADB-style Reaction Wheel Speed (NAWD1020) — fabricated, not real ESA data"

  NCWD0110:
