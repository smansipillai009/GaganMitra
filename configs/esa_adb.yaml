# REAL DATA, LIMITED METADATA:
# The channel IDs (CADC08xx), durations, means/stds, and anomaly labels below
# come from the real, public OPSSAT-AD benchmark (ESA OPS-SAT CubeSat) —
# see data/real_esa_opssat/PROVENANCE.md for the exact source and what was
# and wasn't downloadable in this environment. UNLIKE Mars-Express-style
# mnemonics, ESA's OPSSAT-AD release does not publish plain-English
# descriptions, physical units, or subsystem labels for these channel IDs
# (they're anonymized ADCS/CADC housekeeping channels). "subsystem: unknown"
# and "unit: unknown" below are honest placeholders, not filler — do not
# invent a subsystem or unit for these on a slide. nominal_min/max are
# derived here from the real per-segment mean +/- 3*std observed in the
# fetched data (not an official ESA-published range).
mission_id: "esa_adb"
spacecraft_name: "ESA OPS-SAT / ESA-ADB-style benchmark"
orbit_type: "Low Earth Orbit (CubeSat) / Areocentric (synthetic mode)"
orbital_period_minutes: 95.0

channels:
  # --- Synthetic ESA-ADB-*style* channels used by `--source esa` (generate_esa_benchmark_dataset).
  # NOT real ESA mnemonics — see src/adapters/esa_adb_adapter.py docstring.
  NPWD2372:
    standard_name: "battery_voltage"
    subsystem: "power"
    unit: "V"
    nominal_min: 25.0
    nominal_max: 34.0
    criticality: "critical"
    description: "Synthetic ESA-ADB-style Power Bus Voltage (NPWD2372) — fabricated, not real ESA data"

  NPWD2451:
    standard_name: "battery_current"
    subsystem: "power"
    unit: "A"
    nominal_min: -15.0
    nominal_max: 20.0
    criticality: "high"
    description: "Synthetic ESA-ADB-style Battery Current (NPWD2451) — fabricated, not real ESA data"

  NTWD0005:
    standard_name: "subsystem_temperature"
    subsystem: "thermal"
    unit: "degC"
    nominal_min: -20.0
    nominal_max: 45.0
