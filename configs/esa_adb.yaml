    nominal_min: 28.0
    nominal_max: 38.0
    criticality: "medium"
    description: "Synthetic ESA-ADB-style RF Transmitter Output (NCWD0110) — fabricated, not real ESA data"

  # --- Real OPSSAT-AD channels used by `--source esa-real` (load_real_opssat_segments).
